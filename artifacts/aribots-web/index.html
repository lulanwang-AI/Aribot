<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Ari AMR</title>
    <meta
      name="description"
      content="Antimicrobial stewardship decision support: empiric therapy from the likely organisms and the regional resistance pattern, then the 48 to 72 hour decision to stop, narrow, escalate or switch to oral."
    />
    <meta name="theme-color" content="#0b6b78" />
    <link rel="icon" type="image/png" sizes="32x32" href="/aribot-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/aribot-favicon-64.png" />
    <link rel="apple-touch-icon" href="/aribot-favicon-64.png" />
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var stored = window.localStorage.getItem("aribots_theme");
          var stamped = root.getAttribute("data-theme");
          var theme =
            stored === "dark" || stored === "light"
              ? stored
              : stamped === "dark" || stamped === "light"
                ? stamped
                : window.matchMedia &&
                    window.matchMedia("(prefers-color-scheme: dark)").matches
                  ? "dark"
                  : "light";
          if (theme === "dark") root.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    >
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
