kind = "web"
previewPath = "/"
title = "Ari AMR"
version = "1.0.0"
id = "artifacts/aribots-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20216

[services.development]
run = "pnpm --filter @workspace/aribots-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aribots-web", "run", "build" ]
publicDir = "artifacts/aribots-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20216"
BASE_PATH = "/"
