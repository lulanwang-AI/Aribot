kind = "mobile"
previewPath = "/aribots-mobile/"
title = "ARIbots Mobile"
version = "1.0.0"
id = "artifacts/aribots-mobile"
# Expo Go manifest requests (the expo-platform header) for every path on the
# domain reach this artifact; server/serve.js forwards the sibling apps' paths
# to their own servers (EXPO_PEER_ROUTES below).
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/aribots-mobile/" ]
localPort = 19512

[services.development]
run = "pnpm --filter @workspace/aribots-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aribots-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/aribots-mobile", "run", "serve" ]

[services.env]
PORT = "19512"
BASE_PATH = "/aribots-mobile/"
EXPO_PEER_ROUTES = "/amr-mobile/=19513,/emr-mobile/=19514"
