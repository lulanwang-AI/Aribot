kind = "web"
previewPath = "/aribots-mobile/"
title = "ARIbots Mobile"
version = "1.0.0"
id = "artifacts/aribots-mobile"
router = "path"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/aribots-mobile/" ]
localPort = 19512

[services.development]
run = "pnpm --filter @workspace/aribots-mobile run dev"

# Declared as a path-routed web artifact, like the AMR and EMR apps. As a
# "mobile" artifact on the Expo domain router the published service came up
# without its static build (no Expo Go manifests, no web export), while the
# two path-routed apps built and served correctly from the same scripts.
[services.production]
build = [ "pnpm", "--filter", "@workspace/aribots-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/aribots-mobile", "run", "serve" ]

[services.production.health.startup]
path = "/aribots-mobile/status"

[services.env]
PORT = "19512"
BASE_PATH = "/aribots-mobile/"
