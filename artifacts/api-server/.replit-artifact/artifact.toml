kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
# ANTHROPIC_API_KEY is provisioned via Replit Secrets (auto-injected into
# process.env in both dev and production). It is consumed by
# artifacts/api-server/src/ari/client.ts to power the Aribot clinical chat
# endpoint at POST /api/ari/chat. The server logs `configured: true` on
# boot when the key is present (see src/index.ts startup log).

[services.production.health.startup]
path = "/api/healthz"
